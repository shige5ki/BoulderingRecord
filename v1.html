<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#18231f">
<title>Climbing Log</title>
<style>
:root{--bg:#f4f6f3;--card:#fff;--ink:#1d2924;--muted:#6b7771;--line:#e1e7e2;--accent:#236b50;--soft:#e8f2ec;--danger:#a33b35}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{background:#18231f;color:#fff;padding:22px 18px 18px}header .sub{font-size:11px;letter-spacing:.16em;opacity:.7}header h1{font-size:24px;margin:5px 0 0}
main{max-width:760px;margin:auto;padding:16px 14px 90px}.tabs{display:flex;gap:7px;margin:0 0 16px;overflow:auto}.tab{border:1px solid var(--line);background:#fff;color:var(--muted);padding:10px 13px;border-radius:12px;font-weight:650;white-space:nowrap}.tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
.panel{display:none}.panel.active{display:block}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:13px;box-shadow:0 2px 8px #15251b08}
h2{font-size:18px;margin:0 0 14px}h3{font-size:15px;margin:0 0 10px}.muted{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin-bottom:12px}.field:last-child{margin-bottom:0}label{display:block;font-size:12px;color:var(--muted);font-weight:650;margin-bottom:6px}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:#fff;color:var(--ink);font:inherit;font-size:15px}textarea{min-height:78px;resize:vertical}button{font:inherit;cursor:pointer}.primary{border:0;border-radius:11px;background:var(--accent);color:#fff;padding:12px 15px;font-weight:700}.secondary{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;color:var(--ink);font-weight:650}.small{padding:7px 10px;font-size:12px}.danger{color:var(--danger);border-color:#efd8d5}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.task{border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0;background:#fcfdfc}.taskhead{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:10px}.pill{font-size:11px;padding:4px 8px;border-radius:99px;background:var(--soft);color:var(--accent);font-weight:700}.session{padding:13px 0;border-top:1px solid var(--line)}.session:first-child{border-top:0}.session-title{display:flex;justify-content:space-between;gap:10px;align-items:start}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:13px}.stat{background:var(--soft);padding:12px;border-radius:12px}.stat b{display:block;font-size:22px}.stat span{font-size:11px;color:var(--muted)}.empty{text-align:center;color:var(--muted);padding:22px 8px;font-size:13px}.inline{display:flex;gap:8px;align-items:center}.inline>*{flex:1}.hidden{display:none!important}
@media(max-width:520px){.grid{grid-template-columns:1fr 1fr}.card{padding:14px}.stats{gap:6px}.stat{padding:10px 8px}.stat b{font-size:19px}}
</style>
</head>
<body>
<header><div class="sub">BOULDERING JOURNAL</div><h1>Climbing Log</h1></header>
<main>
<nav class="tabs">
<button class="tab active" data-tab="record">＋ 記録する</button>
<button class="tab" data-tab="history">履歴</button>
<button class="tab" data-tab="settings">設定</button>
</nav>

<section id="record" class="panel active">
<div class="card">
<h2>① セッション記録</h2>
<div class="field"><label>ジム・場所</label><select id="gymSelect"></select></div>
<div class="grid">
<div class="field"><label>日付</label><input id="date" type="date"></div>
<div class="field"><label>開始時刻</label><input id="start" type="time" value="14:00"></div>
<div class="field"><label>終了時刻</label><input id="end" type="time" value="16:00"></div>
<div class="field"><label>合計時間（自動計算）</label><input id="duration" type="text" readonly placeholder="開始・終了時刻から計算"></div>
</div>
<p class="muted">終了時刻を入力すると合計時間が自動で表示されます。</p>
</div>
<div class="card">
<div class="taskhead"><h2 style="margin:0">② 課題記録</h2><span class="pill" id="taskCount">1課題</span></div>
<div id="tasks"></div>
<div class="actions"><button class="secondary" id="addTask">＋ 課題を追加</button></div>
</div>
<button class="primary" style="width:100%" id="saveSession">セッションを保存</button>
<p class="muted" style="text-align:center;margin-top:9px">データはこの端末のブラウザ内に保存されます。</p>
</section>

<section id="history" class="panel">
<div class="stats">
<div class="stat"><b id="sessionTotal">0</b><span>セッション</span></div>
<div class="stat"><b id="taskTotal">0</b><span>登録課題</span></div>
<div class="stat"><b id="sendTotal">0</b><span>完登課題</span></div>
</div>
<div class="card"><h2>記録一覧</h2><div id="historyList" class="empty">まだ記録がありません。</div></div>
</section>

<section id="settings" class="panel">
<div class="card">
<h2>ジム・場所の管理</h2>
<div class="inline"><input id="newGym" placeholder="ジム名を入力"><button class="primary" id="addGym">追加</button></div>
<div id="gymList" style="margin-top:12px"></div>
</div>
<div class="card">
<h2>グレードの管理</h2>
<p class="muted">初期値を用意しています。ジム独自の表記なども追加・削除できます。</p>
<div class="inline"><input id="newGrade" placeholder="例：4級 / V5"><button class="primary" id="addGrade">追加</button></div>
<div id="gradeList" style="margin-top:12px"></div>
</div>
</section>
</main>
<script>
const KEY='climbing-log-v1';
const defaults={gyms:[],grades:['3段','2段','初段','1級','2級','3級','4級','5級'],sessions:[]};
let data=load();
function load(){try{return {...defaults,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){return structuredClone(defaults)}}
function persist(){localStorage.setItem(KEY,JSON.stringify(data))}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function tab(name){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===name));document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id===name));if(name==='history')renderHistory();if(name==='settings')renderSettings()}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>tab(b.dataset.tab)));
document.getElementById('date').value=new Date().toLocaleDateString('sv-SE');
function renderGyms(){let s=document.getElementById('gymSelect'),old=s.value;s.innerHTML='<option value="">場所を選択</option>'+data.gyms.map(g=>`<option>${esc(g)}</option>`).join('');if(data.gyms.includes(old))s.value=old}
function renderSettings(){
document.getElementById('gymList').innerHTML=data.gyms.length?data.gyms.map((g,i)=>`<div class="inline" style="margin:7px 0"><span>${esc(g)}</span><button class="secondary small danger" onclick="removeGym(${i})">削除</button></div>`).join(''):'<p class="muted">登録した場所はまだありません。</p>';
document.getElementById('gradeList').innerHTML=data.grades.map((g,i)=>`<div class="inline" style="margin:7px 0"><span>${esc(g)}</span><button class="secondary small danger" onclick="removeGrade(${i})">削除</button></div>`).join('');
}
function removeGym(i){data.gyms.splice(i,1);persist();renderGyms();renderSettings()}
function removeGrade(i){data.grades.splice(i,1);persist();renderSettings()}
document.getElementById('addGym').onclick=()=>{let v=document.getElementById('newGym').value.trim();if(!v)return;if(!data.gyms.includes(v))data.gyms.push(v);document.getElementById('newGym').value='';persist();renderGyms();renderSettings()};
document.getElementById('addGrade').onclick=()=>{let v=document.getElementById('newGrade').value.trim();if(!v)return;if(!data.grades.includes(v))data.grades.push(v);document.getElementById('newGrade').value='';persist();renderSettings()};
function duration(){let a=document.getElementById('start').value,b=document.getElementById('end').value;if(!a||!b){document.getElementById('duration').value='';return}let [ah,am]=a.split(':').map(Number),[bh,bm]=b.split(':').map(Number);let mins=bh*60+bm-(ah*60+am);if(mins<0)mins+=1440;document.getElementById('duration').value=`${Math.floor(mins/60)}時間${mins%60}分`}
['start','end'].forEach(id=>document.getElementById(id).addEventListener('change',duration));duration();
let taskN=0;
function addTask(){
let id=++taskN,div=document.createElement('div');div.className='task';div.dataset.task=id;
div.innerHTML=`<div class="taskhead"><strong>課題 ${document.querySelectorAll('.task').length+1}</strong><button class="secondary small danger removeTask">削除</button></div>
<div class="grid"><div class="field"><label>課題名・番号</label><input class="t-name" placeholder="例：青テープ 12番"></div>
<div class="field"><label>グレード</label><select class="t-grade">${data.grades.map(g=>`<option>${esc(g)}</option>`).join('')}</select></div>
<div class="field"><label>壁の種類</label><select class="t-wall"><option>スラブ</option><option>垂壁</option><option>薄かぶり</option><option>強傾斜</option><option>バルジ</option><option>ルーフ</option><option>その他</option></select></div>
<div class="field"><label>完登状況</label><select class="t-status"><option value="send">完登</option><option value="not">未完登</option></select></div>
<div class="field"><label>完登までのトライ</label><select class="t-tries"><option value="1">1撃（1トライ）</option><option value="multiple">複数回トライ</option><option value="na">未完登・不明</option></select></div>
</div><div class="field"><label>メモ</label><textarea class="t-note" placeholder="ムーブ、苦手だったところ、次回の課題など"></textarea></div>`;
div.querySelector('.removeTask').onclick=()=>{div.remove();renumber()};div.querySelector('.t-status').onchange=e=>{if(e.target.value==='not')div.querySelector('.t-tries').value='na';else if(div.querySelector('.t-tries').value==='na')div.querySelector('.t-tries').value='1'};
document.getElementById('tasks').appendChild(div);renumber();
}
function renumber(){let ts=[...document.querySelectorAll('.task')];ts.forEach((t,i)=>t.querySelector('strong').textContent=`課題 ${i+1}`);document.getElementById('taskCount').textContent=ts.length+'課題'}
document.getElementById('addTask').onclick=addTask;addTask();
document.getElementById('saveSession').onclick=()=>{
let gym=document.getElementById('gymSelect').value;if(!gym){alert('場所を選択してください。設定からジムを追加できます。');return}
let tasks=[...document.querySelectorAll('.task')].map(t=>({name:t.querySelector('.t-name').value.trim(),grade:t.querySelector('.t-grade').value,wall:t.querySelector('.t-wall').value,status:t.querySelector('.t-status').value,tries:t.querySelector('.t-tries').value,note:t.querySelector('.t-note').value.trim()}));
let session={id:Date.now(),gym,date:document.getElementById('date').value,start:document.getElementById('start').value,end:document.getElementById('end').value,duration:document.getElementById('duration').value,tasks};
data.sessions.unshift(session);persist();alert('セッションを保存しました！');document.getElementById('tasks').innerHTML='';taskN=0;addTask();tab('history');
};
function renderHistory(){
let sessions=data.sessions;let tasks=sessions.flatMap(s=>s.tasks);document.getElementById('sessionTotal').textContent=sessions.length;document.getElementById('taskTotal').textContent=tasks.length;document.getElementById('sendTotal').textContent=tasks.filter(t=>t.status==='send').length;
let list=document.getElementById('historyList');if(!sessions.length){list.className='empty';list.textContent='まだ記録がありません。';return}list.className='';
list.innerHTML=sessions.map(s=>`<div class="session"><div class="session-title"><div><strong>${esc(s.gym)}</strong><div class="muted">${esc(s.date)}　${esc(s.start)}〜${esc(s.end)}（${esc(s.duration)}）</div></div><button class="secondary small danger" onclick="deleteSession(${s.id})">削除</button></div>
<div style="margin-top:9px">${s.tasks.map(t=>`<div style="padding:8px 0;border-top:1px solid var(--line)"><div class="inline"><strong>${esc(t.name||'名前なし')}</strong><span class="pill">${esc(t.grade)}</span><span class="muted">${t.status==='send'?'完登':'未完登'}${t.status==='send'?'・'+(t.tries==='1'?'1撃':t.tries==='multiple'?'複数回':'') :''}</span></div><div class="muted">${esc(t.wall)}${t.note?'　／　'+esc(t.note):''}</div></div>`).join('')}</div></div>`).join('');
}
function deleteSession(id){if(!confirm('このセッション記録を削除しますか？'))return;data.sessions=data.sessions.filter(s=>s.id!==id);persist();renderHistory()}
renderGyms();
</script>
</body></html>
